<title>3DInfinite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Style « clay » : un monde indigo profond, des cartes de verre aux coins très ronds, des boutons modelés,
   un accent chaud (orange → rose) pour l'action principale et l'état actif, un turquoise pour la sélection dans la scène.
   Un seul univers visuel, volontairement sombre : le plateau 3D reste lisible et les objets colorés ressortent. */
:root{
  --bg:#0c0a22; --panel:#211c4e; --panel-2:#2c2568; --glass:rgba(33,28,80,.8); --line:rgba(168,158,255,.2); --fg:#f3f1ff; --muted:#aea8dc;
  --accent:#a394ff; --accent-fg:#140f38; --hover:rgba(255,255,255,.09); --danger:#ff8298;
  --warm:linear-gradient(135deg,#ffab5e,#ff6190); --warm-fg:#2a0f34; --warm-solid:#ff8468;
  --scene:#1a1548; --plate:#2f2879; --grid:#574db8; --grid-strong:#9486ff; --handle:#ffffff; --hole:#a59ee0; --select:#5ee6d8;
  --field:rgba(8,6,32,.55);
  --shadow:0 18px 44px rgba(4,2,24,.6);
  --clay:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 4px rgba(6,4,30,.35),0 8px 18px rgba(4,2,24,.45);
  --font-ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-brand:"Outfit",system-ui,sans-serif;
  color-scheme:dark;
}

html,body{height:100%}
body{background:radial-gradient(900px 520px at 12% -8%,rgba(120,90,255,.35),transparent 70%),radial-gradient(700px 480px at 100% 110%,rgba(255,97,144,.16),transparent 70%),var(--bg);
  color:var(--fg);font-family:var(--font-ui);font-size:13.5px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--select);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* barre du haut : une carte flottante */
.bar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;background:var(--glass);border:1px solid var(--line);border-radius:20px;margin:10px 10px 0;box-shadow:var(--shadow);
  padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-brand);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-right:12px;background:var(--warm);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{color:transparent}
.sep{width:1px;height:22px;background:var(--line);margin:0 7px}
.grow{flex:1}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:12px;background:transparent;transition:background .15s,transform .15s,box-shadow .15s}
.ib:hover:not(:disabled){background:var(--hover);transform:translateY(-1px)}
.ib:active:not(:disabled){transform:translateY(0)}
.ib:disabled{opacity:.3;cursor:default}
.ib[aria-expanded="true"],.ib[aria-pressed="true"]{background:var(--warm);color:var(--warm-fg);box-shadow:0 6px 16px rgba(255,105,130,.35)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel-2),var(--panel));border-radius:12px;padding:7px 12px;font-weight:500;white-space:nowrap;box-shadow:var(--clay);transition:transform .15s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.btn.primary{background:var(--warm);color:var(--warm-fg);border-color:transparent;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px rgba(255,105,130,.38)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:10px}
.ib[aria-expanded="true"]:hover:not(:disabled),.ib[aria-pressed="true"]:hover:not(:disabled){background:var(--warm)}
.lang{font-weight:600;font-size:12px;width:auto;padding:0 10px;margin-left:4px;display:inline-flex;align-items:center;gap:6px}
.lang .fl{display:block;width:20px;height:13px;opacity:.4;transition:opacity .15s}
.lang .fl.on{opacity:1}
.lang .fl svg{width:100%;height:100%;display:block;border-radius:2px}
.bar .btn + .btn{margin-left:6px}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:10px;padding:10px}
.lib{background:var(--glass);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:auto;padding-block:14px;padding-left:14px;padding-right:max(14px,env(safe-area-inset-right,0px))}
h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lib h2:not(:first-child){margin-top:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{display:flex;align-items:center;justify-content:center;height:62px;padding:0;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(150deg,#3a3186,#261f5e);box-shadow:var(--clay);touch-action:none;user-select:none;min-width:0;transition:transform .16s,box-shadow .16s,filter .16s}
.tile:hover{transform:translateY(-3px);filter:brightness(1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 24px rgba(4,2,24,.55),0 0 0 1px var(--select)}
.tile:active{transform:translateY(0)}
.tile svg{width:36px;height:36px;stroke:#e4dfff;fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 3px 4px rgba(4,2,24,.5))}
.tile:hover svg{stroke:var(--select)}
.libsel{margin-bottom:12px;padding:9px 10px;font-weight:500}
#hw-box .row{margin-bottom:12px}
.hmode{display:flex;gap:6px;margin:2px 0 8px}
.btn[aria-pressed="true"]{background:var(--warm);color:var(--warm-fg);border-color:transparent}
.btn .ic{width:16px;height:16px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.row.two{grid-template-columns:1fr 1fr}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11px;color:var(--muted)}
.fld input,.fld select,.wide{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:6px 8px;font-variant-numeric:tabular-nums;min-width:0}
.fld input:focus,.fld select:focus,.wide:focus,.sl input:not([type=range]):focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(163,148,255,.25)}

/* plateau 3D et ses calques */
.view{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;
  background:radial-gradient(ellipse 75% 65% at 50% 46%,#4a37c4 0%,#2a2080 42%,#171243 78%,#110d33 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float{position:absolute;display:flex;gap:7px}
.vtools{top:12px;left:12px;flex-direction:column;align-items:center}
.vtools .ib,.chips .ib{background:var(--glass);border:1px solid var(--line);box-shadow:var(--clay);backdrop-filter:blur(10px)}
.vtools .ib:hover,.chips .ib:hover{border-color:var(--select)}
.vtools .ib[aria-pressed="true"],.chips .ib[aria-pressed="true"]{background:var(--warm);color:var(--warm-fg);border-color:transparent}
.chips{right:12px;bottom:12px;align-items:center}
.chips select{border:1px solid var(--line);border-radius:12px;background:var(--glass);padding:7px 8px;height:36px;box-shadow:var(--clay)}
.cubewrap{width:84px;height:84px;display:grid;place-items:center;margin-bottom:4px;cursor:grab;touch-action:none;filter:drop-shadow(0 8px 12px rgba(4,2,24,.55))}
#cube{width:50px;height:50px;position:relative;transform-style:preserve-3d}
#cube div{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,#463c9c,#2c2568);border:1px solid var(--grid-strong);border-radius:6px;font-size:9px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;backface-visibility:hidden;user-select:none}
#cube div:hover{background:var(--warm);color:var(--warm-fg)}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
#insp{position:absolute;top:12px;right:12px;width:272px;max-height:calc(100% - 72px);overflow:auto;padding:12px 14px 14px}
.phead{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:10px}
.phead .ib{width:26px;height:26px;border-radius:9px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg2 button{display:flex;align-items:center;justify-content:center;padding:8px 4px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--panel-2),var(--panel));font-weight:500;box-shadow:var(--clay)}
.seg2 button[aria-pressed="true"]{border-color:transparent;box-shadow:var(--clay),0 0 0 2px var(--warm-solid)}
.sq{width:30px;height:30px;border-radius:9px;display:block;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 2px 3px rgba(255,255,255,.3),inset 0 -3px 5px rgba(0,0,0,.25)}
/* une seule ligne : Plein, Vide, puis les couleurs ; Plein reste neutre pour que le choix de couleur se lise à part */
.sl .seg2{grid-column:2 / 4;margin:0}
.sl .seg2 button{height:32px;padding:0}
.kindrow{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.kindrow .seg2{display:flex;gap:4px;margin:0}
.kindrow .seg2 button{width:28px;height:28px;padding:0;border-radius:9px}
.kindrow .sq{width:14px;height:14px;border-radius:5px}
#sq-solid{background:#e4e1f5}
.kindrow .swatches{flex:1;min-width:0;margin:0;flex-wrap:nowrap;justify-content:space-between;gap:0}
.kindrow .sw{width:16px;height:16px;flex:0 0 auto}
.sq.hole{background:repeating-linear-gradient(45deg,var(--hole) 0 4px,transparent 4px 8px);box-shadow:none}
.swatches{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.22);padding:0;box-shadow:inset 0 2px 3px rgba(255,255,255,.35),inset 0 -3px 4px rgba(0,0,0,.28),0 3px 6px rgba(4,2,24,.45);transition:transform .12s}
.sw:hover{transform:scale(1.15)}
.sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#ff5f6d,#ffc371,#5ee6a8,#4fc3f7,#a394ff,#ff5f6d);cursor:pointer}
.sw.custom input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;margin:0 0 10px;color:var(--muted)}
.chk input{accent-color:var(--warm-solid);width:15px;height:15px}
.sl{display:grid;grid-template-columns:80px minmax(0,1fr) 56px;gap:9px;align-items:center;margin-bottom:8px}
.sl>span{font-size:12.5px;color:var(--muted)}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:6px;border-radius:99px;background:linear-gradient(90deg,#8b7bff,#ff7a8a);cursor:pointer}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 4px rgba(163,148,255,.3)}
.sl input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 4px rgba(163,148,255,.3)}
.sl input:not([type=range]),.sl select{border:1px solid var(--line);border-radius:10px;background:var(--field);padding:5px 7px;font-variant-numeric:tabular-nums;min-width:0;width:100%}
.sl select{grid-column:2 / 4}
.unitsw{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--field);margin:0 0 9px;float:right}
.unitsw button{border:0;background:none;border-radius:8px;padding:2px 9px;font-size:12px;color:var(--muted)}
.unitsw button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:var(--clay)}
.unitsw+*{clear:both}
.xyz{display:grid;grid-template-columns:20px repeat(3,minmax(0,1fr));gap:6px;align-items:end;margin-bottom:8px}
.xyz>svg{width:18px;height:18px;margin-bottom:7px;color:var(--muted)}
.symbtn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.symbtn button{border:1px solid var(--line);border-radius:10px;background:var(--field);padding:6px 0;font-weight:600}
.symbtn button[aria-pressed="true"]{background:var(--warm);color:var(--warm-fg);border-color:transparent}
#b-sym[data-on="1"]{background:var(--warm);color:var(--warm-fg)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:12.5px;margin-bottom:8px}
.dims{font-variant-numeric:tabular-nums;margin:0;color:var(--muted)}

/* menus et bulles */
.pop{position:fixed;z-index:30;padding:12px;min-width:180px;max-width:min(300px,calc(100vw - 16px))}
.menu{display:flex;flex-direction:column;gap:2px;padding:7px}
.menu button{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:10px;padding:8px 10px;text-align:left}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button:disabled{opacity:.35;cursor:default}
.menu kbd{margin-left:auto;font:inherit;font-size:11px;color:var(--muted);padding-left:14px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
#ctx{position:absolute;z-index:20;min-width:210px}
.aligns{display:grid;grid-template-columns:auto repeat(3,36px);gap:5px;align-items:center}
.aligns b{font-size:11px;color:var(--muted);font-weight:600;padding-right:6px}
.aligns .ib,.mirrors .ib{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel-2),var(--panel));box-shadow:var(--clay)}
.mirrors{display:flex;gap:6px}
.mirrors .ib{width:auto;padding:0 11px;gap:6px;display:inline-flex;font-weight:600}
.help{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:12.5px}
.help b{font-weight:600;color:var(--select)}
.note{color:var(--muted);font-size:12px;margin:10px 0 0}

#dlg-contact{width:min(470px,calc(100vw - 24px));padding:20px;color:var(--fg);background:var(--panel)}
#dlg-contact::backdrop{background:rgba(6,4,26,.62)}
#dlg-contact h3{margin:0;font-size:16px;font-weight:600}
#dlg-contact h3+.note{margin:4px 0 14px}
#dlg-contact .fld{margin-bottom:10px}
#dlg-contact textarea{font:inherit;color:inherit;resize:vertical;min-height:110px;font-variant-numeric:normal}
#dlg-contact .end{justify-content:flex-end;margin:14px 0 0}
#ct-files{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
#ct-files li{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ct-files:empty{display:none}
#ct-status:empty{display:none}

/* notification : un simple message d'état, pas un bouton (fond sombre discret, texte sobre, pastille d'accent) */
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:70%;padding:6px 12px 6px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(20,16,56,.72);backdrop-filter:blur(10px);color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.35;text-align:left;z-index:5;pointer-events:none;box-shadow:0 6px 16px rgba(4,2,24,.35);animation:toastIn .18s ease-out}
#toast::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--select);flex:none}
#toast[hidden]{display:none}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-4px)}to{opacity:1;transform:translate(-50%,0)}}
#band{position:absolute;pointer-events:none;border:1px solid var(--select);border-radius:6px;background:color-mix(in srgb,var(--select) 14%,transparent)}
#tip{position:absolute;pointer-events:none;background:#fff;color:#1a1446;padding:3px 9px;border-radius:8px;font-weight:600;font-variant-numeric:tabular-nums;transform:translate(14px,14px);white-space:nowrap;box-shadow:0 6px 14px rgba(4,2,24,.5)}
.dimlbl{position:absolute;left:0;top:0;pointer-events:none;background:#fff;color:#1a1446;padding:1px 6px;border-radius:5px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;transform:translate(-50%,-50%);white-space:nowrap;box-shadow:0 2px 6px rgba(4,2,24,.35)}
#insp-dims{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.dimsrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.dimsrow .chk{margin:0 0 8px}
.dimunit{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
.view.over::after{content:"";position:absolute;inset:10px;border:2px dashed var(--select);border-radius:16px;pointer-events:none}
#fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--scene);color:var(--danger);font-weight:500;z-index:40}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(168,158,255,.3);border-radius:99px;border:2px solid transparent;background-clip:padding-box}

@media (max-width:760px){
  body{overflow:auto}
  .work{display:flex;flex-direction:column}
  .view{height:62vh;flex:none}
  .lib{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tiles{grid-template-columns:repeat(5,1fr)}
  #insp{width:min(272px,calc(100% - 100px))}
}
@media (prefers-reduced-motion:reduce){ .ib,.btn,.tile,.sw{transition:none} }
/* colonne unique : la bibliothèque ou l'objet sélectionné, au choix (onglets Formes | Objet) */
/* repère du mode symétrie, en bas de la scène */
#symbadge{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);pointer-events:none;padding:6px 14px;border-radius:99px;background:rgba(20,16,56,.82);border:1px solid var(--select);color:var(--select);font-weight:600;font-size:12.5px;white-space:nowrap;z-index:4;box-shadow:0 6px 16px rgba(4,2,24,.35)}
#insp{position:static;width:auto;max-height:none;overflow:visible;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none}
.lib.tab-obj #pane-lib{display:none}
.lib:not(.tab-obj) #insp{display:none}
.ibrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ibrow .ib{width:100%;height:32px;border-radius:10px}
/* code couleur des axes, le même que les flèches de rotation sur le plateau : X rouge, Y vert, Z bleu (lettre + fin liseré sur le champ) */
.ax0{color:#ff6b6b;font-weight:600}
.ax1{color:#6bdc8a;font-weight:600}
.ax2{color:#6aa8ff;font-weight:600}
.fld:has(.ax0) input{border-left:2px solid rgba(255,107,107,.6)}
.fld:has(.ax1) input{border-left:2px solid rgba(107,220,138,.6)}
.fld:has(.ax2) input{border-left:2px solid rgba(106,168,255,.6)}
.isep{height:1px;background:var(--line);margin:12px 0}
.sico{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sico svg{width:18px;height:18px}
[hidden]{display:none!important}
/* page d'accueil */
#home{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:clamp(16px,6vh,56px) 20px 24px;overflow:auto;background:radial-gradient(900px 500px at 15% -10%,rgba(148,134,255,.18),transparent 60%),var(--bg)}
.home-in{width:min(900px,100%);display:grid;gap:16px}
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.home-brand{font-size:38px;margin:0}
.home-top .note{margin:2px 0 0}
.home-cols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.home-card{background:var(--glass);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px}
.home-card h2{margin:0 0 12px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.home-act{display:flex;width:100%;margin-bottom:8px;padding:11px 14px;font-size:14px}
.home-links{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 0}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer}
.lnk:hover{text-decoration:underline}
.home-update{display:flex;align-items:center;justify-content:space-between;gap:16px;border-color:var(--select)}
.home-update .note{margin:2px 0 0}
.hu-notes{margin:8px 0 0;max-height:96px;overflow:auto;white-space:pre-line;font-size:12.5px;color:var(--muted)}
.home-update .acts{display:flex;gap:8px;flex:none}
.hu-bar{display:block;width:100%;height:7px;margin-top:10px;accent-color:var(--select)}
#h-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
/*__MANIFOLD_JS__*/
const WASM_B64 = "__WASM_B64__";
const FONT_B64 = "__FONT_B64__";
/*__GEOM_JS__*/

const $ = id => document.getElementById(id);
function fatal(msg){ const f=$('fatal'); f.textContent=msg; f.hidden=false; }

/* ---------- moteur géométrique ---------- */
let Manifold, CrossSection, MMesh, G;
try{
  const bin = Uint8Array.from(atob(WASM_B64), c=>c.charCodeAt(0));
  const wasm = await Module({wasmBinary: bin.buffer});
  wasm.setup();
  ({Manifold, CrossSection, Mesh: MMesh} = wasm);
  G = makeGeom(wasm);
}catch(e){
  console.error(e);
  fatal("Le moteur 3D n'a pas pu démarrer dans cette fenêtre. Ouvre le fichier 3DInfinite.html directement dans Chrome ou Edge.");
  throw e;
}
if(!window.THREE){ fatal("La bibliothèque d'affichage 3D n'a pas pu être chargée. Vérifie la connexion internet puis recharge la page."); throw new Error('three'); }

/* maillage de base : sommets centrés sur l'origine + taille de la boîte englobante */
function baseFrom(man){
  const m = man.getMesh();
  const v = new Float32Array(m.vertProperties.length/m.numProp*3);
  for(let i=0,j=0;i<m.vertProperties.length;i+=m.numProp,j+=3){ v[j]=m.vertProperties[i]; v[j+1]=m.vertProperties[i+1]; v[j+2]=m.vertProperties[i+2]; }
  const t = new Uint32Array(m.triVerts);
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<v.length;i+=3) for(let k=0;k<3;k++){ if(v[i+k]<mn[k])mn[k]=v[i+k]; if(v[i+k]>mx[k])mx[k]=v[i+k]; }
  const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  for(let i=0;i<v.length;i+=3){ v[i]-=c[0]; v[i+1]-=c[1]; v[i+2]-=c[2]; }
  return { base:{verts:v, tris:t, size:[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]]}, center:c };
}
function make(fn){ const man=fn(); const r=baseFrom(man); man.delete(); return r.base; }

const SHAPES = {
  box:     {name:'Boîte',     icon:'<path d="M5 12l12-6 12 6v12l-12 6-12-6z"/><path d="M5 12l12 6 12-6M17 18v12"/>',
            build:()=>Manifold.cube([20,20,20],true)},
  cyl:     {name:'Cylindre',  icon:'<ellipse cx="17" cy="9" rx="10" ry="4"/><path d="M7 9v16c0 2.2 4.5 4 10 4s10-1.8 10-4V9"/>',

/* arrondit chaque sommet d'un polygone ; f[i] entre 0 et 1 = part de la demi-arête consommée par l'arrondi */
function filletPoly(pts,f){
  const n=pts.length, out=[];
  for(let i=0;i<n;i++){
    const a=pts[(i+n-1)%n], b=pts[i], c=pts[(i+1)%n], fi=f[i]||0;
    const ux=a[0]-b[0], uy=a[1]-b[1], vx=c[0]-b[0], vy=c[1]-b[1], lu=Math.hypot(ux,uy), lv=Math.hypot(vx,vy);
    const d=fi*.5*Math.min(lu,lv); if(d<1e-4){ out.push(b); continue; }

    const ang=Math.acos(Math.max(-1,Math.min(1,(ux*vx+uy*vy)/(lu*lv)))), r=d*Math.tan(ang/2);
    let bx=ux/lu+vx/lv, by=uy/lu+vy/lv; const bl=Math.hypot(bx,by); if(bl<1e-9){ out.push(b); continue; }
    const dc=Math.hypot(d,r), cx=b[0]+bx/bl*dc, cy=b[1]+by/bl*dc;
    let a0=Math.atan2(t1[1]-cy,t1[0]-cx), a1=Math.atan2(t2[1]-cy,t2[0]-cx), da=a1-a0;
    while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
    const k=Math.max(2,Math.ceil(Math.abs(da)/(Math.PI/36)));
    for(let j=0;j<=k;j++){ const t=a0+da*j/k; out.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]); }
  }
  return out;
}

/* cône, pyramide, rampe, dôme : les arêtes vives s'arrondissent par « ouverture » (on érode d'une bille, puis on regonfle).
   Cône et dôme sont des révolutions : l'ouverture se fait sur leur coupe, c'est instantané. Sphère et anneau n'ont aucune arête vive. */
for(const k of ['cone','pyramid','wedge','dome']){ SHAPES[k].oldTris=SHAPES[k].base.tris.length; SHAPES[k].shp={k,rr:0}; }
for(const k of ['sphere','torus']) SHAPES[k].smooth=1;
function shapeSolid(k,size,shp){
  const rr=shp.rr||0, ref=SHAPES[k].base.size; let m;
  if(rr>0 && (k==='cone'||k==='dome')){
    const R=size[0]/2, H=size[2]; let sec;
    if(k==='cone') sec=[[-R,-H/2],[R,-H/2],[0,H/2]];
    else{ sec=[]; for(let i=0;i<=96;i++){ const a=Math.PI*i/96; sec.push([R*Math.cos(a),H*Math.sin(a)]); } }
    const cs=new CrossSection(sec), er=cs.offset(-rr,'Round',2,24); cs.delete();
    if(er.isEmpty()){ er.delete(); return null; }
    const op=er.offset(rr,'Round',2,24); er.delete();
    const big=Math.max(R,H)*4+10, half=op.intersect(CrossSection.square([big,big*2]).translate([0,-big])); op.delete();
    const rv=Manifold.revolve(half,160); half.delete();
    m=rv.scale([1,size[1]/size[0],1]); rv.delete();
  }else if(rr>0 && SHAPES[k].sec){
    /* triangle et toit : la coupe est arrondie puis extrudée avec ses arêtes de bout arrondies, comme un profil */
    const fx=size[0]/ref[0], fz=size[2]/ref[2], src=[SHAPES[k].sec.map(q=>[q[0]*fx,q[1]*fz])];
    const pm=G.profileSolid({...PROF0,src,h:size[1],r:rr,rt:rr,rb:rr}); if(!pm) return null;
    m=pm.rotate([90,0,0]); pm.delete();
  }else{
    const b=SHAPES[k].build(); m=b.scale([size[0]/ref[0],size[1]/ref[1],size[2]/ref[2]]); b.delete();
    if(rr>0){
      const ball=Manifold.sphere(rr,24), er=m.minkowskiDifference(ball); m.delete();
      if(er.isEmpty()){ er.delete(); ball.delete(); return null; }
      m=er.minkowskiSum(ball); er.delete(); ball.delete();
    }
  }
  if(shp.mx||shp.my||shp.mz){ const f=m.scale([shp.mx?-1:1,shp.my?-1:1,shp.mz?-1:1]); m.delete(); m=f; }
  /* l'arrondi rogne les pointes : on remet la boîte à la taille demandée */
  const bb=m.boundingBox(), sc=[0,1,2].map(i=>size[i]/Math.max(1e-6,bb.max[i]-bb.min[i]));
  if(rr>0 && sc.some(v=>Math.abs(v-1)>1e-4)){ const c=[0,1,2].map(i=>-(bb.max[i]+bb.min[i])/2), f=m.translate(c).scale(sc); m.delete(); m=f; }
  return m;
}
function shapeBase(k,size,shp){ const m=shapeSolid(k,size,shp); if(!m) return null; const r=baseFrom(m); m.delete(); return r.base; }
function applyShp(o,shp){
  let base; try{ base=shapeBase(shp.k,o.size,shp); }catch(e){ console.error(e); base=null; }
  if(!base) return false;
  const bottom=boxOf(o).min[2];
  o.shp=shp; o.base=base; o.size=[...base.size]; o.pos[2]+=bottom-boxOf(o).min[2];
  return true;
}

/* ---------- état ---------- */
const COLORS = [['Orange','#ff9a52'],['Rouge','#f0566e'],['Jaune','#ffd166'],['Vert','#4fd39a'],['Cyan','#3fd0d8'],['Bleu','#4f7cff'],['Violet','#9b7bff'],['Blanc','#f6f3ff'],['Gris','#9a97b8'],['Noir','#2a2540']];
const PRINTERS = [
  ['Elegoo Centauri Carbon',256,256,256],['Bambu Lab A1 / P1 / X1',256,256,256],['Bambu Lab A1 mini',180,180,180],
  ['Prusa MK4',250,210,220],['Prusa MINI+',180,180,180],['Creality Ender-3 V3',220,220,250],['Creality K1',220,220,250],['Personnalisé',200,200,200]];
const SNAPS = [['Libre',0],['0,1 mm',.1],['0,5 mm',.5],['1 mm',1],['2 mm',2],['5 mm',5]];
const S = { objs:[], sel:new Set(), unit:'mm', snap:1, plate:[256,256,256], undo:[], redo:[], nextId:1, count:{} };

const cloneObj = o => ({...o, pos:[...o.pos], rot:[...o.rot], size:[...o.size]});
const snapshot = () => ({objs:S.objs.map(cloneObj), sel:[...S.sel]});
function pushUndo(){ S.undo.push(snapshot()); if(S.undo.length>80) S.undo.shift(); S.redo.length=0; markDirty(); }
function restore(s){ S.objs=s.objs.map(cloneObj); S.sel=new Set(s.sel); refresh(); }
function undo(){ if(!S.undo.length) return; S.redo.push(snapshot()); restore(S.undo.pop()); markDirty(); }
function redo(){ if(!S.redo.length) return; S.undo.push(snapshot()); restore(S.redo.pop()); markDirty(); }
const selected = () => S.objs.filter(o=>S.sel.has(o.id));
const byId = id => S.objs.find(o=>o.id===id);

const D2R = Math.PI/180;
const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _p=new THREE.Vector3(), _s=new THREE.Vector3();
function matrixOf(o, out=new THREE.Matrix4()){
  _e.set(o.rot[0]*D2R,o.rot[1]*D2R,o.rot[2]*D2R,'XYZ'); _q.setFromEuler(_e);
  _p.set(o.pos[0],o.pos[1],o.pos[2]);
  _s.set(o.size[0]/o.base.size[0], o.size[1]/o.base.size[1], o.size[2]/o.base.size[2]);
  return out.compose(_p,_q,_s);
}
/* boîte englobante exacte dans le monde */
function boxOf(o){
  const e=matrixOf(o,_m).elements, v=o.base.verts;
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<v.length;i+=3){
    const x=v[i],y=v[i+1],z=v[i+2];
    for(let k=0;k<3;k++){ const w=e[k]*x+e[4+k]*y+e[8+k]*z+e[12+k]; if(w<mn[k])mn[k]=w; if(w>mx[k])mx[k]=w; }
  }
  return {min:mn,max:mx};
}
function boxOfMany(list){
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(const o of list){ const b=boxOf(o); for(let k=0;k<3;k++){ mn[k]=Math.min(mn[k],b.min[k]); mx[k]=Math.max(mx[k],b.max[k]); } }
  return {min:mn,max:mx};
}
function toManifold(o){
  const mesh = new MMesh({numProp:3, vertProperties:o.base.verts, triVerts:o.base.tris});
  const a = new Manifold(mesh);
  const b = a.transform(Array.from(matrixOf(o).elements));
  a.delete(); return b;
}
function unionAll(list){
  if(!list.length) return null;
  const parts=list.map(toManifold);
  const u = parts.length===1 ? parts[0] : Manifold.union(parts);
  if(parts.length>1) parts.forEach(p=>p.delete());
  return u;
}

/* ---------- actions ---------- */
function newObj(base, name, extra={}){
  return {id:S.nextId++, name, kind:'shape', hole:false, color:COLORS[0][1], base, pos:[0,0,0], rot:[0,0,0], size:[...base.size], children:null, ...extra};
}
function label(n){ S.count[n]=(S.count[n]||0)+1; return n+' '+S.count[n]; }
function addShape(kind){
  pushUndo();
  const sh=SHAPES[kind], o=newObj(sh.base, label(sh.name), sh.prof?{kind:'profile',prof:sh.prof}:sh.shp?{shp:{...sh.shp}}:sh.smooth?{smooth:1}:{});
  const n=S.objs.length%6;
  o.pos=[S.plate[0]/2+n*6, S.plate[1]/2-n*6, o.size[2]/2];
  S.objs.push(o); S.sel=new Set([o.id]); refresh();
}
function removeSel(){ if(!S.sel.size) return; pushUndo(); S.objs=S.objs.filter(o=>!S.sel.has(o.id)); S.sel.clear(); refresh(); }
/* dx : décalage de la copie en mm (10 par défaut ; 0 pour une copie sur place, quand on la déplace tout de suite) */
function duplicateSel(dx){
  const list=selected(); if(!list.length) return; pushUndo(); if(typeof dx!=='number') dx=10;
  const ids=[];
  const made=[]; for(const o of list){ const c=cloneObj(o); c.id=S.nextId++; c.name=o.name+' copie'; c.pos[0]+=dx; made.push(c); ids.push(c.id); }
  regid(made); S.objs.push(...made);
  S.sel=new Set(ids); refresh();
}
function dropSel(){
  const list=selected(); if(!list.length) return; pushUndo();
  for(const o of list) o.pos[2]-=boxOf(o).min[2];
  refresh();
}
function alignSel(axis,mode){
  const list=selected(); if(list.length<2) return; pushUndo();
  const all=boxOfMany(list);
  const target = mode===0?all.min[axis] : mode===2?all.max[axis] : (all.min[axis]+all.max[axis])/2;
  for(const o of list){ const b=boxOf(o); const cur = mode===0?b.min[axis] : mode===2?b.max[axis] : (b.min[axis]+b.max[axis])/2; o.pos[axis]+=target-cur; }
  refresh();
}
function fuseSel(){
  const list=selected(); if(list.length<2){ toast('Sélectionne au moins deux objets à fusionner.'); return; }
  const solids=list.filter(o=>!o.hole), holes=list.filter(o=>o.hole);
  let res;
  try{
    const a=unionAll(solids), b=unionAll(holes);
    if(a&&b){ res=a.subtract(b); a.delete(); b.delete(); } else res=a||b;
  }catch(e){ console.error(e); toast("La fusion a échoué sur ces objets."); return; }
  if(res.isEmpty()){ res.delete(); toast('Les vides retirent toute la matière : rien à fusionner.'); return; }
  const {base,center}=baseFrom(res); res.delete();
  if(solids.length){ try{ const paint=buildPaint(list,center,null); if(paint) base.paint=paint; }catch(e){ console.error(e); } }
  pushUndo();
  const first=solids[0]||list[0];
  const g=newObj(base, label('Fusion'), {kind:'group', hole:!solids.length, color:first.color, pos:center, children:list.map(c=>{ const k=cloneObj(c); delete k.gid; return k; }), origin:[...center]});
  S.objs=S.objs.filter(o=>!S.sel.has(o.id)); S.objs.push(g); S.sel=new Set([g.id]); refresh();
}
/* groupe souple : les objets bougent ensemble mais restent des objets à part entière (rien n'est fusionné) */
const withGroup=ids=>{ const out=new Set(); for(const id of ids){ out.add(id); const o=byId(id); if(o&&o.gid) for(const q of S.objs) if(q.gid===o.gid) out.add(q.id); } return out; };
function newGid(){ let m=S.gidN||0; for(const o of S.objs) if(o.gid>m) m=o.gid; for(const o of clip) if(o.gid>m) m=o.gid; return S.gidN=m+1; }
/* après une copie : chaque lot de copies forme son propre groupe, et un objet copié seul sort du groupe */
function regid(copies){
  const cnt=new Map(), map=new Map();
  for(const c of copies) if(c.gid) cnt.set(c.gid,(cnt.get(c.gid)||0)+1);
  for(const c of copies){ if(!c.gid) continue; if(cnt.get(c.gid)<2){ delete c.gid; continue; } if(!map.has(c.gid)) map.set(c.gid,newGid()); c.gid=map.get(c.gid); }
}
function groupSel(){
  const list=selected(); if(list.length<2){ toast('Sélectionne au moins deux objets à grouper.'); return; }
  pushUndo(); const g=newGid(); list.forEach(o=>{ o.gid=g; }); refresh();
  toast('Groupé : les objets bougent ensemble. Double-clic pour en choisir un seul.');
}
function ungroupSel(){
  const sel=selected(), groups=sel.filter(o=>o.kind==='group'), linked=sel.filter(o=>o.gid&&o.kind!=='group');
  if(!groups.length&&!linked.length) return;
  pushUndo(); const ids=[]; linked.forEach(o=>{ delete o.gid; ids.push(o.id); });
  for(const g of groups){
    /* déplacement subi par le groupe depuis sa création, à reporter sur chaque enfant */
    const fl=g.flip||[0,0,0];
    const rel=matrixOf(g).multiply(new THREE.Matrix4().makeScale(fl[0]?-1:1,fl[1]?-1:1,fl[2]?-1:1)).multiply(new THREE.Matrix4().makeTranslation(-g.origin[0],-g.origin[1],-g.origin[2]));
    for(const c0 of g.children){
      const c=cloneObj(c0); c.id=S.nextId++;
      const M=rel.clone().multiply(matrixOf(c0));
      const p=new THREE.Vector3(), q=new THREE.Quaternion(), s=new THREE.Vector3(); M.decompose(p,q,s);
      const back=new THREE.Matrix4().compose(p,q,s); let err=0;
      for(let i=0;i<16;i++) err=Math.max(err,Math.abs(back.elements[i]-M.elements[i]));
      if(err<1e-4 && M.determinant()>0){
        const e=new THREE.Euler().setFromQuaternion(q,'XYZ');
        c.pos=[p.x,p.y,p.z]; c.rot=[e.x/D2R,e.y/D2R,e.z/D2R].map(r=>Math.round(r*1000)/1000);
        c.size=[s.x*c.base.size[0],s.y*c.base.size[1],s.z*c.base.size[2]];
        if(c.kind==='hw'){ if(Math.abs(s.x-1)+Math.abs(s.y-1)+Math.abs(s.z-1)>1e-6){ c.kind='shape'; c.hw=null; } } else settle(c);
      }else{
        /* étirement de travers : on fige la déformation dans le maillage */
        const v=new Float32Array(c.base.verts), e=M.elements;
        for(let i=0;i<v.length;i+=3){ const x=v[i],y=v[i+1],z=v[i+2]; v[i]=e[0]*x+e[4]*y+e[8]*z+e[12]; v[i+1]=e[1]*x+e[5]*y+e[9]*z+e[13]; v[i+2]=e[2]*x+e[6]*y+e[10]*z+e[14]; }
        let tr=c.base.tris; if(M.determinant()<0){ tr=new Uint32Array(tr); for(let i=0;i<tr.length;i+=3){ const x=tr[i+1]; tr[i+1]=tr[i+2]; tr[i+2]=x; } }
        const man=new Manifold(new MMesh({numProp:3,vertProperties:v,triVerts:tr})); const r=baseFrom(man); man.delete();
        c.base=r.base; c.pos=r.center; c.rot=[0,0,0]; c.size=[...r.base.size]; if(c.kind==='profile'||c.kind==='hw'){ c.kind='shape'; c.prof=null; c.hw=null; } c.shp=null;
      }
      S.objs.push(c); ids.push(c.id);
    }
    S.objs=S.objs.filter(o=>o.id!==g.id);
  }
  S.sel=new Set(ids); refresh();
}

/* ---------- miroir ---------- */
function setQuat(o,q){ const e=new THREE.Euler().setFromQuaternion(q,'XYZ'); o.rot=[e.x/D2R,e.y/D2R,e.z/D2R].map(r=>Math.round(r*1000)/1000+0); }
/* miroir de l'objet par rapport au plan (axe k du monde, à la cote c) */
function mirrorObj(o,k,c){
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rot[0]*D2R,o.rot[1]*D2R,o.rot[2]*D2R,'XYZ'));
  let done=false;
  if(o.kind==='profile' && !(k===2 && o.prof.shell>0)){
    const p={...o.prof}; if(k===0) p.mx=!p.mx; else if(k===1) p.my=!p.my; else { const t=p.rt; p.rt=p.rb; p.rb=t; }
    const base=profBase(p); if(base){ o.prof=p; o.base=base; done=true; }
  }
  if(!done && o.shp){ const q={...o.shp}, f='m'+'xyz'[k]; q[f]=!q[f]; let base=null; try{ base=shapeBase(q.k,o.size,q); }catch(e){ console.error(e); } if(base){ o.shp=q; o.base=base; done=true; } }
  if(!done){
    const fm=(v0,t0)=>{ const v=new Float32Array(v0), t=new Uint32Array(t0);
      for(let i=k;i<v.length;i+=3) v[i]=-v[i];
      for(let i=0;i<t.length;i+=3){ const x=t[i+1]; t[i+1]=t[i+2]; t[i+2]=x; }
      return {verts:v,tris:t}; };
    const nb={...fm(o.base.verts,o.base.tris), size:o.base.size};
    if(o.base.paint) nb.paint=o.base.paint.map(q=>({color:q.color,...fm(q.verts,q.tris)}));
    o.base=nb;
    if(o.kind==='profile'||o.kind==='hw'){ o.kind='shape'; o.prof=null; o.hw=null; }
    if(o.kind==='group'){ o.flip=[...(o.flip||[0,0,0])]; o.flip[k]^=1; }
  }
  const a=[q.x,q.y,q.z]; for(let j=0;j<3;j++) if(j!==k) a[j]=-a[j];
  setQuat(o,q.set(a[0],a[1],a[2],q.w)); o.pos[k]=2*c-o.pos[k];
}
function mirrorSel(k){
  const list=selected(); if(!list.length) return; pushUndo();
  const b=boxOfMany(list), c=(b.min[k]+b.max[k])/2;
  for(const o of list) mirrorObj(o,k,c);
  refresh();
}
/* ---------- répétition ---------- */
function copyXform(o, mirror, deg, px, py){
  const c=cloneObj(o); c.id=S.nextId++;
  if(mirror) mirrorObj(c,0,px);
  if(deg){
    const q0=new THREE.Quaternion().setFromEuler(new THREE.Euler(c.rot[0]*D2R,c.rot[1]*D2R,c.rot[2]*D2R,'XYZ'));
    setQuat(c,new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),deg*D2R).multiply(q0));
    const a=deg*D2R, dx=c.pos[0]-px, dy=c.pos[1]-py; c.pos[0]=px+dx*Math.cos(a)-dy*Math.sin(a); c.pos[1]=py+dx*Math.sin(a)+dy*Math.cos(a);
  }
  return c;
}
function repeatUI(reset){
  const lin=$('r-type').value==='lin';
  $('r-lc').hidden=!lin;
  $('r-la').firstElementChild.textContent=T(lin?'Écart X':'Diamètre'); $('r-lb').firstElementChild.textContent=T(lin?'Écart Y':'Écartement'); $('r-lc').firstElementChild.textContent=T('Écart Z');
  const list=selected(), bb=list.length?boxOfMany(list):null, w=bb?bb.max[0]-bb.min[0]:20, d=bb?bb.max[1]-bb.min[1]:20, big=Math.max(S.plate[0],S.plate[1]);
  const rng=(id,mn,mx)=>{ const e=$('rs-'+id); e.min=mn; e.max=mx; e.step=S.snap||1; };
  if(lin){ rng('a',-big/2,big/2); rng('b',-big/2,big/2); rng('c',0,S.plate[2]/2); }
  else{ rng('a',Math.ceil(Math.max(w,d)),big); rng('b',1,Math.max(20,Math.ceil(big/2))); }
  if(reset){
    $('r-c').value=0;
    if(lin){ $('r-n').value=3; $('r-a').value=fmt(Math.ceil(w)+5); $('r-b').value=0; }
    else{ const D=Math.max(40,Math.ceil(Math.max(w,d)*3)); $('r-n').value=6; $('r-a').value=fmt(D); $('r-b').value=fmt(+(Math.PI*D/6).toFixed(1)); }
  }
  for(const id of ['n','a','b','c']) $('rs-'+id).value=num($('r-'+id).value)||0;
}
/* ---------- visserie : trous prêts à l'emploi (cotes ISO courantes, inserts type laiton à chaud) ---------- */
const HW={'M2':{d:2,cap:3.8,csk:4,af:4,nut:1.6,ins:3.2,insL:4},'M2,5':{d:2.5,cap:4.5,csk:5,af:5,nut:2,ins:4,insL:5},'M3':{d:3,cap:5.5,csk:6,af:5.5,nut:2.4,ins:4,insL:5.7},
  'M4':{d:4,cap:7,csk:8,af:7,nut:3.2,ins:5.6,insL:8.1},'M5':{d:5,cap:8.5,csk:10,af:8,nut:4,ins:6.4,insL:9.5},'M6':{d:6,cap:10,csk:12,af:10,nut:5,ins:8,insL:12.7},'M8':{d:8,cap:13,csk:16,af:13,nut:6.5,ins:9.7,insL:12.7}};
const HWNAME={hole:'Trou',csk:'Trou fraisé',cap:'Trou tête cyl.',nut:'Écrou',ins:'Insert'};
function hwSolid(hw){
  const h=HW[hw.size], j=hw.j, r=h.d/2+j, L=Math.max(.5,hw.L);
  if(hw.type==='csk'){ const rh=h.csk/2+j, hc=Math.min(rh-r,L), sh=Manifold.cylinder(L,r,r,48), co=Manifold.cylinder(hc,r,r+hc,48).translate([0,0,L-hc]), m=sh.add(co); sh.delete(); co.delete(); return m; }
  if(hw.type==='cap'){ const hk=Math.min(h.d+j,L), sh=Manifold.cylinder(L,r,r,48), hd=Manifold.cylinder(hk,h.cap/2+j,h.cap/2+j,48).translate([0,0,L-hk]), m=sh.add(hd); sh.delete(); hd.delete(); return m; }
  if(hw.type==='nut'){ const R=(h.af/2+j)/Math.cos(Math.PI/6); return Manifold.cylinder(L,R,R,6); }
  if(hw.type==='ins') return Manifold.cylinder(L,h.ins/2,h.ins/2,48);
  return Manifold.cylinder(L,r,r,48);
}
function hwBase(hw){ const man=hwSolid(hw), {base}=baseFrom(man); man.delete(); return base; }
/* taille et jeu se règlent dans le panneau de l'objet posé ; le dernier choix sert de point de départ au suivant */
const HWDEF={size:'M3',j:.2};
function applyHW(o,hw){ HWDEF.size=hw.size; if(hw.type!=='ins') HWDEF.j=hw.j; const base=hwBase(hw), bottom=boxOf(o).min[2]; o.hw=hw; o.base=base; o.size=[...base.size]; o.pos[2]+=bottom-boxOf(o).min[2]; }
function addHardware(type){
  const size=HWDEF.size, h=HW[size], j=type==='ins'?0:HWDEF.j;
  const hw={type,size,j,L:type==='nut'?h.nut+j:type==='ins'?h.insL+1:20}, base=hwBase(hw);
  pushUndo();
  const o=newObj(base,label(HWNAME[type]+' '+size),{hole:true,kind:'hw',hw}), n=S.objs.length%6;
  o.pos=[S.plate[0]/2+n*6, S.plate[1]/2-n*6, o.size[2]/2];
  S.objs.push(o); S.sel=new Set([o.id]); refresh();
}

/* ---------- groupes multicolores ---------- */
function colorParts(o){
  if(!o.base.paint) return [{color:o.color, man:toManifold(o)}];
  const e=Array.from(matrixOf(o).elements);
  return o.base.paint.map(q=>{ const a=new Manifold(new MMesh({numProp:3,vertProperties:q.verts,triVerts:q.tris})), b=a.transform(e); a.delete(); return {color:q.color, man:b}; });
}
/* retire les débris (composantes de moins de 0,01 mm3) laissés par les soustractions ; rend une nouvelle pièce */
function dropDust(m){
  const parts=m.decompose(); if(parts.length<2){ parts.forEach(p=>p.delete()); return m.translate([0,0,0]); }
  const keep=parts.filter(p=>p.volume()>=.01); parts.forEach(p=>{ if(!keep.includes(p)) p.delete(); });
  if(!keep.length) return m.translate([0,0,0]);
  const u=keep.length>1?Manifold.union(keep):keep[0]; if(keep.length>1) keep.forEach(p=>p.delete()); return u;
}
/* une pièce fermée par couleur, sans recouvrement : la première couleur rencontrée garde la matière commune */
function buildPaint(children, origin, flip){
  const byColor=new Map(), fl=flip||[0,0,0], odd=(fl[0]+fl[1]+fl[2])%2===1;
  for(const o of children) if(!o.hole) for(const q of colorParts(o)){
    const cur=byColor.get(q.color); if(cur){ byColor.set(q.color,cur.add(q.man)); cur.delete(); q.man.delete(); } else byColor.set(q.color,q.man); }
  if(byColor.size<2){ for(const m of byColor.values()) m.delete(); return null; }
  const hu=unionAll(children.filter(o=>o.hole)), paint=[]; let acc=null;
  for(const [color,m0] of byColor){
    let m=m0;
    if(hu){ const x=m.subtract(hu); m.delete(); m=x; }
    if(acc){ const x=m.subtract(acc); m.delete(); m=x; }
    if(!m.isEmpty()){ const k=dropDust(m); m.delete(); m=k; }
    if(!m.isEmpty()){
      if(acc){ const x=acc.add(m); acc.delete(); acc=x; } else acc=m.translate([0,0,0]);
      const mesh=m.getMesh(), np=mesh.numProp, v=new Float32Array(mesh.vertProperties.length/np*3), t=new Uint32Array(mesh.triVerts);
      for(let a=0,b=0;a<mesh.vertProperties.length;a+=np,b+=3) for(let k=0;k<3;k++) v[b+k]=(mesh.vertProperties[a+k]-origin[k])*(fl[k]?-1:1);
      if(odd) for(let a=0;a<t.length;a+=3){ const x=t[a+1]; t[a+1]=t[a+2]; t[a+2]=x; }
      paint.push({color,verts:v,tris:t});
    }
    m.delete();
  }
  if(acc) acc.delete(); if(hu) hu.delete();
  return paint.length>1?paint:null;
}
function setMulti(o,on){
  if(!on){ o.base={...o.base}; delete o.base.paint; return true; }
  let paint; try{ paint=buildPaint(o.children,o.origin,o.flip); }catch(e){ console.error(e); paint=null; }
  if(!paint){ toast("Ce groupe n'a qu'une seule couleur de pièces."); return false; }
  o.base={...o.base,paint}; return true;
}

/* ---------- export ---------- */
function stlBytes(man){
  const m=man.getMesh(), v=m.vertProperties, t=m.triVerts, np=m.numProp, n=t.length/3;
  const buf=new ArrayBuffer(84+n*50), dv=new DataView(buf);
  new Uint8Array(buf).set(new TextEncoder().encode('3DInfinite'));
  dv.setUint32(80,n,true); let o=84;
  for(let i=0;i<t.length;i+=3){
    const a=t[i]*np,b=t[i+1]*np,c=t[i+2]*np;
    const ux=v[b]-v[a],uy=v[b+1]-v[a+1],uz=v[b+2]-v[a+2], wx=v[c]-v[a],wy=v[c+1]-v[a+1],wz=v[c+2]-v[a+2];
    let nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx; const l=Math.hypot(nx,ny,nz)||1;
    dv.setFloat32(o,nx/l,true); dv.setFloat32(o+4,ny/l,true); dv.setFloat32(o+8,nz/l,true); o+=12;
    for(const k of [a,b,c]){ dv.setFloat32(o,v[k],true); dv.setFloat32(o+4,v[k+1],true); dv.setFloat32(o+8,v[k+2],true); o+=12; }
    o+=2;
  }
  return new Uint8Array(buf);
}
function zipFiles(files){
  const tbl=new Uint32Array(256); for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; tbl[i]=c; }
  const enc=new TextEncoder(), ent=files.map(f=>{ const data=typeof f.data==='string'?enc.encode(f.data):f.data; let crc=-1; for(let i=0;i<data.length;i++) crc=tbl[(crc^data[i])&255]^(crc>>>8); return {nm:enc.encode(f.name),data,crc:(crc^-1)>>>0}; });
  const size=ent.reduce((a,e)=>a+76+2*e.nm.length+e.data.length,22), out=new Uint8Array(size), dv=new DataView(out.buffer); let o=0;
  for(const e of ent){ e.off=o; dv.setUint32(o,0x04034b50,true); dv.setUint16(o+4,20,true); dv.setUint32(o+14,e.crc,true); dv.setUint32(o+18,e.data.length,true); dv.setUint32(o+22,e.data.length,true); dv.setUint16(o+26,e.nm.length,true);
    out.set(e.nm,o+30); out.set(e.data,o+30+e.nm.length); o+=30+e.nm.length+e.data.length; }
  const cd=o;
  for(const e of ent){ dv.setUint32(o,0x02014b50,true); dv.setUint16(o+4,20,true); dv.setUint16(o+6,20,true); dv.setUint32(o+16,e.crc,true); dv.setUint32(o+20,e.data.length,true); dv.setUint32(o+24,e.data.length,true); dv.setUint16(o+28,e.nm.length,true); dv.setUint32(o+42,e.off,true);
    out.set(e.nm,o+46); o+=46+e.nm.length; }
  dv.setUint32(o,0x06054b50,true); dv.setUint16(o+8,ent.length,true); dv.setUint16(o+10,ent.length,true); dv.setUint32(o+12,o-cd,true); dv.setUint32(o+16,cd,true);
  return out;
}
const zipOne=(name,data)=>zipFiles([{name,data}]);
/* 3MF : chaque objet plein reste une pièce à part, avec sa couleur */
function build3MF(list){
  const esc=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  let mats='', res='', items='';
  let id=1, mi=0;
  const addMesh=(name,color,v,np,t)=>{ const vs=[], ts=[]; id++;
    /* soudure à 1e-4 mm : les sommets que l arrondi du fichier confondrait ne font plus qu un, et les triangles ainsi écrasés disparaissent */
    const seen=new Map(), map=new Uint32Array(v.length/np);
    for(let k=0,n=0;k<v.length;k+=np,n++){ const x=+v[k].toFixed(4), y=+v[k+1].toFixed(4), z=+v[k+2].toFixed(4), key=x+' '+y+' '+z; let i=seen.get(key); if(i===undefined){ i=seen.size; seen.set(key,i); vs.push('<vertex x="'+x+'" y="'+y+'" z="'+z+'"/>'); } map[n]=i; }
    for(let k=0;k<t.length;k+=3){ const a=map[t[k]], b=map[t[k+1]], c=map[t[k+2]]; if(a!==b&&b!==c&&a!==c) ts.push('<triangle v1="'+a+'" v2="'+b+'" v3="'+c+'"/>'); }
    mats+='<base name="'+esc(name)+'" displaycolor="'+color.toUpperCase()+'FF"/>';
    res+='<object id="'+id+'" type="model" name="'+esc(name)+'" pid="1" pindex="'+(mi++)+'"><mesh><vertices>'+vs.join('')+'</vertices><triangles>'+ts.join('')+'</triangles></mesh></object>';
    return id; };
  for(const o of list){
    if(o.base.paint){
      const e=matrixOf(o).elements;
      const ids=o.base.paint.map((q,n)=>{ const v=new Float32Array(q.verts.length);
        for(let a=0;a<v.length;a+=3){ const x=q.verts[a],y=q.verts[a+1],z=q.verts[a+2]; v[a]=e[0]*x+e[4]*y+e[8]*z+e[12]; v[a+1]=e[1]*x+e[5]*y+e[9]*z+e[13]; v[a+2]=e[2]*x+e[6]*y+e[10]*z+e[14]; }
        return addMesh(o.name+' · pièce '+(n+1),q.color,v,3,q.tris); });
      id++; res+='<object id="'+id+'" type="model" name="'+esc(o.name)+'"><components>'+ids.map(c=>'<component objectid="'+c+'"/>').join('')+'</components></object>';
      items+='<item objectid="'+id+'"/>';
    }else{
      const man=toManifold(o), m=man.getMesh(); man.delete();
      items+='<item objectid="'+addMesh(o.name,o.color,m.vertProperties,m.numProp,m.triVerts)+'"/>';
    }
  }
  const model='<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="fr-FR" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><metadata name="Application">3DInfinite</metadata><resources><basematerials id="1">'+mats+'</basematerials>'+res+'</resources><build>'+items+'</build></model>';
  return zipFiles([
    {name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>'},
    {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>'},
    {name:'3D/3dmodel.model',data:model}]);
}

/* ---------- import STL ---------- */
function parseSTL(buf){
  const dv=new DataView(buf), head=new TextDecoder().decode(new Uint8Array(buf,0,Math.min(buf.byteLength,1024)));
  let pos;
  if(/^\s*solid/.test(head) && /facet/.test(head)){
    const txt=new TextDecoder().decode(buf), re=/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g, a=[]; let m;
    while((m=re.exec(txt))) a.push(+m[1],+m[2],+m[3]);
    pos=new Float32Array(a);
  }else{
    if(buf.byteLength<84) throw new Error('court');
    const n=Math.min(dv.getUint32(80,true), Math.floor((buf.byteLength-84)/50));
    pos=new Float32Array(n*9);
    for(let i=0;i<n;i++){ const o=84+i*50+12; for(let k=0;k<9;k++) pos[i*9+k]=dv.getFloat32(o+k*4,true); }
  }
  if(pos.length<9) throw new Error('vide');
  /* soudure des sommets identiques, sans quoi le maillage n'est pas un volume fermé */
  const map=new Map(), verts=[], tris=[];
  const vid=i=>{ const key=pos[i]+','+pos[i+1]+','+pos[i+2]; let id=map.get(key); if(id===undefined){ id=verts.length/3; map.set(key,id); verts.push(pos[i],pos[i+1],pos[i+2]); } return id; };
  for(let i=0;i+8<pos.length;i+=9){ const a=vid(i),b=vid(i+3),c=vid(i+6); if(a!==b&&b!==c&&a!==c) tris.push(a,b,c); }
  return {verts:new Float32Array(verts), tris:new Uint32Array(tris)};
}
async function importSTL(files){
  const ids=[]; let bad=0, first=true;
  for(const f of files){
    try{
      const raw=parseSTL(await f.arrayBuffer());
      const man=new Manifold(new MMesh({numProp:3,vertProperties:raw.verts,triVerts:raw.tris}));
      if(man.isEmpty()){ man.delete(); throw new Error('vide'); }
      const {base}=baseFrom(man); man.delete();
      if(first){ pushUndo(); first=false; }
      const o=newObj(base, f.name.replace(/\.stl$/i,''), {kind:'import'});
      o.pos=[S.plate[0]/2+ids.length*8, S.plate[1]/2-ids.length*8, o.size[2]/2];
      S.objs.push(o); ids.push(o.id);
    }catch(e){ console.error(e); bad++; }
  }
  if(ids.length){ S.sel=new Set(ids); refresh(); fitView(); }
  if(bad) toast(bad>1 ? T("{0} fichiers n'ont pas pu être importés : ce ne sont pas des volumes fermés.",bad) : "Import impossible : ce STL n'est pas un volume fermé (trous ou faces en double).");
}

const b64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };

function serialize(){
  const bases=[], idx=new Map();
  const bi=b=>{ let i=idx.get(b); if(i===undefined){ i=bases.length; idx.set(b,i);
    bases.push({v:b64(new Uint8Array(b.verts.buffer,b.verts.byteOffset,b.verts.byteLength)), t:b64(new Uint8Array(b.tris.buffer,b.tris.byteOffset,b.tris.byteLength)), s:b.size,
      p:b.paint?b.paint.map(q=>({c:q.color, v:b64(new Uint8Array(q.verts.buffer,q.verts.byteOffset,q.verts.byteLength)), t:b64(new Uint8Array(q.tris.buffer,q.tris.byteOffset,q.tris.byteLength))})):undefined}); } return i; };
  const so=o=>({...o, base:bi(o.base), children:o.children?o.children.map(so):null});
  return {app:'3DInfinite', version:1, plate:S.plate, printer:+$('p-printer').value, unit:S.unit, snap:S.snap, sym:S.sym||0, nextId:S.nextId, count:S.count, objs:S.objs.map(so), bases};
}
function deserialize(d){
  if(!d||d.app!=='3DInfinite'||!Array.isArray(d.objs)) throw new Error('format');
  const bases=d.bases.map(b=>{ const o={verts:new Float32Array(unb64(b.v).buffer), tris:new Uint32Array(unb64(b.t).buffer), size:b.s};
    if(b.p) o.paint=b.p.map(q=>({color:q.c, verts:new Float32Array(unb64(q.v).buffer), tris:new Uint32Array(unb64(q.t).buffer)})); return o; });
  const lo=o=>({...o, base:bases[o.base], children:o.children?o.children.map(lo):null});
  S.objs=d.objs.map(lo); S.sel=new Set(); S.nextId=d.nextId||1; S.sym=[2,4,8].includes(d.sym)?d.sym:0; S.count=d.count||{}; S.unit=d.unit||'mm'; S.snap=d.snap??1;
  $('p-unit').value=S.unit; $('p-snap').value=String(S.snap); $('p-printer').value=String(d.printer??0);
  $('p-custom').hidden=PRINTERS[+$('p-printer').value][0]!=='Personnalisé';
  setPlate(d.plate||[256,256,256]);
}

/* flèches haut et bas dans un champ numérique : pas de 1 (ou de 10 avec Maj), la valeur est appliquée comme si on l'avait tapée */
addEventListener('keydown',e=>{
  if(e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
  const el=e.target, mode=(el.getAttribute&&el.getAttribute('inputmode'))||'';
  if(el.tagName!=='INPUT' || !/^(decimal|numeric)$/.test(mode) || el.disabled || el.readOnly) return;
  const m=String(el.value).match(/^\s*(-?\d+(?:[.,]\d+)?)(.*)$/); if(!m) return;
  e.preventDefault();
  const sep=m[1].search(/[.,]/), dec=sep<0?0:m[1].length-sep-1;
  let v=(num(m[1])||0)+(e.shiftKey?10:1)*(e.key==='ArrowUp'?1:-1);
  if(dec) v=+v.toFixed(dec);
  el.value=String(v).replace('.',S.lang==='fr'?',':'.')+m[2];
  el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true}));
});

async function sendContact(){

function centered(polys){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const c of polys) for(const q of c){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0]; if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  return {polys:polys.map(c=>c.map(q=>[q[0]-cx,q[1]-cy])), w:x1-x0, h:y1-y0};
}
function cleanPolys(polys,rule){ const cs=new CrossSection(polys,rule); const out=cs.toPolygons().map(G.dedupe).filter(c=>c.length>2); cs.delete(); return out; }
function textPolys(str, fontId, size){
  const f=FONTS.get(fontId); if(!f) return null;
  const cmds=f.font.getPath(str,0,0,size).commands, polys=[], N=10; let cur=null, x=0, y=0;
  for(const c of cmds){
    if(c.type==='M'){ if(cur&&cur.length>2) polys.push(cur); cur=[[c.x,-c.y]]; }
    else if(c.type==='L') cur.push([c.x,-c.y]);
    else if(c.type==='Q') for(let i=1;i<=N;i++){ const u=i/N, v=1-u; cur.push([v*v*x+2*v*u*c.x1+u*u*c.x, -(v*v*y+2*v*u*c.y1+u*u*c.y)]); }
    else if(c.type==='C') for(let i=1;i<=N;i++){ const u=i/N, v=1-u; cur.push([v*v*v*x+3*v*v*u*c.x1+3*v*u*u*c.x2+u*u*u*c.x, -(v*v*v*y+3*v*v*u*c.y1+3*v*u*u*c.y2+u*u*u*c.y)]); }
    if(c.x!==undefined){ x=c.x; y=c.y; }
  }
  if(cur&&cur.length>2) polys.push(cur);
  if(!polys.length) return null;
  const out=cleanPolys(polys,'NonZero'); return out.length?centered(out).polys:null;
}

function svgPolys(txt){
  const data=new THREE.SVGLoader().parse(txt), parts=[];
  const filled=data.paths.filter(p=>{ const st=p.userData&&p.userData.style; return !st||(st.fill!==undefined&&st.fill!=='none'); });
  for(const p of (filled.length?filled:data.paths)){
    const polys=[]; for(const sp of p.subPaths){ const c=G.dedupe(sp.getPoints(16).map(v=>[v.x,-v.y])); if(c.length>2) polys.push(c); }
    if(polys.length) parts.push(new CrossSection(polys, p.userData&&p.userData.style&&p.userData.style.fillRule==='evenodd'?'EvenOdd':'NonZero'));
  }
  if(!parts.length) return null;
  const u=parts.length>1?CrossSection.union(parts):parts[0];
  const polys=u.toPolygons().map(G.dedupe).filter(c=>c.length>2);
  if(parts.length>1) parts.forEach(q=>q.delete()); u.delete();
  if(!polys.length) return null;
  /* taille réelle si le fichier la donne en unités physiques, sinon 100 mm sur le plus grand côté */
  const c=centered(polys), root=new DOMParser().parseFromString(txt,'image/svg+xml').documentElement;
  const m=(root.getAttribute('width')||'').trim().match(/^([\d.]+)\s*(mm|cm|in|pt)$/), vb=(root.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  let k, real=false;
  if(m && vb.length===4 && vb[2]>0){ k=parseFloat(m[1])*{mm:1,cm:10,in:25.4,pt:25.4/72}[m[2]]/vb[2]; real=true; }
  else k=100/Math.max(c.w,c.h);
  const scaled=c.polys.map(q=>q.map(v=>[v[0]*k,v[1]*k])), clean=G.cleanPolys(scaled,{minDist:.01,eps:.005,minArea:.05,open:.01});
  return {polys:clean.length?clean:scaled, real};
}
/* un ou plusieurs SVG : chacun devient un objet, légèrement décalé du précédent, une seule étape d'annulation */
async function importSVG(files){
  files=[].concat(files); const ids=[]; let bad=0, first=true, real=true, why='';
  for(const file of files){

    if(!r){ bad++; why="Aucune forme pleine trouvée dans ce SVG."; continue; }
    const prof={...PROF0, src:r.polys, h:5}, base=profBase(prof);

    if(first){ pushUndo(); first=false; }

    o.pos=[S.plate[0]/2+ids.length*8, S.plate[1]/2-ids.length*8, o.size[2]/2];

}

const overCanvas = ev => { const r=canvas.getBoundingClientRect(); return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom; };
const worldPerPx = () => camera.position.distanceTo(controls.target)*2*Math.tan(camera.fov*D2R/2)/Math.max(1,view.clientHeight);

/* navigation maison : aucune dépendance au clic droit */
const nav={
  orbit(dx,dy){
    const off=camera.position.clone().sub(controls.target), r=off.length();
    let az=Math.atan2(off.y,off.x), el=Math.asin(Math.max(-1,Math.min(1,off.z/r)));
    az-=dx*.006; el=Math.max(-1.55,Math.min(1.55,el+dy*.006));
    camera.position.set(controls.target.x+r*Math.cos(el)*Math.cos(az), controls.target.y+r*Math.cos(el)*Math.sin(az), controls.target.z+r*Math.sin(el));
    controls.update();
  },
  pan(dx,dy){
    const k=worldPerPx(); camera.updateMatrixWorld();
    const d=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).multiplyScalar(-dx*k).addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1),dy*k);
    camera.position.add(d); controls.target.add(d); controls.update();
  },
  zoom(f){
    const off=camera.position.clone().sub(controls.target), r=Math.max(8,Math.min(6000,off.length()*f));
    camera.position.copy(controls.target).add(off.setLength(r)); controls.update();
  },
  look(n){ const r=camera.position.distanceTo(controls.target); camera.position.copy(controls.target).addScaledVector(n.clone().normalize(),r); controls.update(); }
};
let spaceDown=false, nd=null;
addEventListener('keydown',e=>{ if(e.code==='Space' && !/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)){ spaceDown=true; e.preventDefault(); } });
addEventListener('keyup',e=>{ if(e.code==='Space') spaceDown=false; });
canvas.addEventListener('wheel',ev=>{
  ev.preventDefault();
  if(ev.ctrlKey) nav.zoom(Math.exp(Math.max(-40,Math.min(40,ev.deltaY))*.012));
  else{ const k=ev.deltaMode===1?ev.deltaY*33:ev.deltaY; nav.zoom(Math.exp(Math.max(-200,Math.min(200,k))*.0013)); }
},{passive:false});

/* magnétisme : les bords et le centre de la sélection s'accrochent à ceux des autres objets et du plateau */
const guides=new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color:0xffab5e,depthTest:false,transparent:true}));
guides.renderOrder=20; guides.visible=false; scene.add(guides);
function magnetStart(d){
  d.box=boxOfMany(selected());
  d.cands=[[0,S.plate[0]/2,S.plate[0]],[0,S.plate[1]/2,S.plate[1]]]; d.span=[[0,S.plate[0]],[0,S.plate[1]]];
  for(const o of S.objs) if(!S.sel.has(o.id)){ const b=boxOf(o);
    for(let a=0;a<2;a++){ d.cands[a].push(b.min[a],(b.min[a]+b.max[a])/2,b.max[a]); d.span[a][0]=Math.min(d.span[a][0],b.min[a]); d.span[a][1]=Math.max(d.span[a][1],b.max[a]); } }
}
function magnetApply(d,delta){
  const tol=7*worldPerPx(), seg=[];
  for(let a=0;a<2;a++){
    let best=null;
    for(const mv of [d.box.min[a],(d.box.min[a]+d.box.max[a])/2,d.box.max[a]]) for(const c of d.cands[a]){ const diff=c-(mv+delta[a]); if(Math.abs(diff)<tol && (!best||Math.abs(diff)<Math.abs(best.diff))) best={diff,c}; }
    if(best){ delta[a]+=best.diff; const b=1-a, lo=Math.min(d.span[b][0],d.box.min[b]+delta[b])-5, hi=Math.max(d.span[b][1],d.box.max[b]+delta[b])+5;
      seg.push(a===0?[best.c,lo,.05,best.c,hi,.05]:[lo,best.c,.05,hi,best.c,.05]); }
  }
  guides.geometry.setAttribute('position',new THREE.Float32BufferAttribute(seg.flat(),3)); guides.visible=seg.length>0;
  return delta;
}

let drag=null, hoverRot=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('dblclick',ev=>{ setRay(ev); scene.updateMatrixWorld(); const hit=pickObj(); if(hit){ S.sel=new Set([hit.object.userData.id]); refresh(); } });
canvas.addEventListener('pointerdown',ev=>{
  hideCtx();
  /* Alt (Option sur Mac) ou Cmd maintenu sur une forme : copie sur place, puis le geste déplace la copie (comme dans Photoshop ou Figma) */
  let dupHit=null;
  if(ev.button===0 && (ev.altKey||ev.metaKey) && !spaceDown){ setRay(ev); scene.updateMatrixWorld(); dupHit=pickObj()||null; }
  if(dupHit){ const id=dupHit.object.userData.id; if(!S.sel.has(id)) S.sel=withGroup([id]); duplicateSel(0); }
  else if(ev.button===1 || ev.button===2 || (ev.button===0 && (spaceDown||ev.altKey||ev.ctrlKey||ev.metaKey))){
    nd={pan:ev.button===1||spaceDown||(ev.shiftKey&&ev.button!==1), x:ev.clientX, y:ev.clientY, sx:ev.clientX, sy:ev.clientY, moved:false, ctx:ev.button===2||(ev.button===0&&ev.ctrlKey)};
    canvas.setPointerCapture(ev.pointerId); ev.preventDefault(); return;
  }
  if(ev.button!==0) return;
  setRay(ev); scene.updateMatrixWorld();
  if(alignOn()){
    const dot=dotAt();
    if(dot){ pushUndo(); alignApply(selected(),dot.userData.axis,dot.userData.mode); hoverDot=null; canvas.style.cursor=''; clearGhosts(); refresh(); return; }
  }
  const start={x:ev.clientX,y:ev.clientY};
  const rots=gizmo.userData.multi?[]:gz.rot;
  let gh=gizmo.visible ? (ray.intersectObjects(gz.size,true)[0] || ray.intersectObjects(rots,true)[0]) : null, gd=null;
  if(gh){ let n=gh.object; while(n && !n.userData.g) n=n.parent; gd=n&&n.userData; }
  if(gd && gd.g==='size'){
    const sel=selected(), o=gizmoTarget(sel), f=frameOf(o), h=o.size.map(v=>v/2);
    /* plusieurs objets : on retient l'état de départ de chacun pour les remettre à l'échelle d'un bloc */
    const multi=sel.length>1?{box0:boxOfMany(sel),items:sel.map(q=>{ const g=frameOf(q); return {q,pos:[...q.pos],size:[...q.size],ax:[g.ax,g.ay,g.az]}; })}:null;
    const A=f.c.clone().addScaledVector(f.az,-h[2]);
    let n;
    if(gd.top){ const cd=camera.getWorldDirection(V3()); n=cd.addScaledVector(f.az,-cd.dot(f.az)); if(n.lengthSq()<1e-4) n.copy(f.ax); n.normalize(); }
    else{ A.addScaledVector(f.ax,-gd.sx*h[0]).addScaledVector(f.ay,-gd.sy*h[1]); n=f.az.clone(); }
    drag={mode:'size',o,f,A,multi,s0:[...o.size],sx:gd.sx,sy:gd.sy,top:gd.top,plane:new THREE.Plane().setFromNormalAndCoplanarPoint(n,A),start,moved:false};
  }else if(gd && gd.g==='rot'){
    const o=selected()[0], f=frameOf(o), e=V3().setComponent(gd.a,1), p0=V3();
    const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(e,f.c);
    const flat=Math.abs(ray.ray.direction.dot(e))<.15 || !ray.ray.intersectPlane(plane,p0);
    const bb=boxOf(o), dm=[0,1,2].map(i=>bb.max[i]-bb.min[i]), R=Math.hypot(dm[(gd.a+1)%3],dm[(gd.a+2)%3])/2+camera.position.distanceTo(f.c)*.03;
    rotRing.position.copy(f.c); rotRing.quaternion.setFromUnitVectors(V3(0,0,1),e); rotRing.scale.setScalar(R); rotRing.material.color.set(ROT_COL[gd.a]);
    const v0=p0.sub(f.c), R2=flat?R:Math.max(R*.5,v0.length()*.88); rotRing.scale.setScalar(R2);
    drag={mode:'rot',o,f,e,plane,v0,flat,start,moved:false,R:R2,a:gd.a};
  }else if(handle.visible && ray.intersectObject(handle).length){
    const n=camera.getWorldDirection(new THREE.Vector3()); n.z=0; if(n.lengthSq()<1e-4) n.set(0,1,0); n.normalize();
    const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(n,handle.position), p0=new THREE.Vector3();
    if(ray.ray.intersectPlane(plane,p0)) drag={mode:'lift',plane,p0,start,moved:false,orig:null};
  }else{
    const hit=pickObj();
    if(hit){
      const id=hit.object.userData.id;
      /* copie en cours : on déplace les copies sélectionnées, l'original reste en place */
      if(dupHit){ /* rien à changer à la sélection */ }
      else if(ev.shiftKey){ const has=S.sel.has(id); for(const m of withGroup([id])) has?S.sel.delete(m):S.sel.add(m); }
      else if(!S.sel.has(id)) S.sel=withGroup([id]);
      refresh();
      if(S.sel.has(id) || dupHit){
        const plane=new THREE.Plane(new THREE.Vector3(0,0,1),-hit.point.z);
        drag={mode:'move',plane,p0:hit.point.clone(),start,moved:false,orig:null,clickId:(ev.shiftKey||dupHit)?null:id};
      }
    }else drag={mode:'empty',start,moved:false};
  }
  if(drag) canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove',ev=>{
  if(nd){
    if(!nd.moved && Math.hypot(ev.clientX-nd.sx,ev.clientY-nd.sy)<4) return;
    nd.moved=true; const dx=ev.clientX-nd.x, dy=ev.clientY-nd.y; nd.x=ev.clientX; nd.y=ev.clientY;
    nd.pan?nav.pan(dx,dy):nav.orbit(dx,dy); return;
  }
  if(!drag){
    if(alignOn()){
      setRay(ev); scene.updateMatrixWorld(); const dot=dotAt();
      if(dot!==hoverDot){ hoverDot=dot; canvas.style.cursor=dot?'pointer':''; if(dot) showGhosts(alignApply(selected().map(cloneObj),dot.userData.axis,dot.userData.mode)); else clearGhosts(); draw(); }
    }
    /* survol d'une flèche de rotation : elle reprend sa pleine opacité */
    let g=null;
    if(gizmo.visible&&!gizmo.userData.multi){ setRay(ev); const h=ray.intersectObjects(gz.rot,true)[0]; if(h){ let n=h.object; while(n && !n.userData.g) n=n.parent; g=n&&n.userData.g==='rot'?n:null; } }
    if(g!==hoverRot){ hoverRot=g; draw(); }
    return;
  }
  if(!drag.moved && Math.hypot(ev.clientX-drag.start.x,ev.clientY-drag.start.y)<4) return;
  if(drag.mode==='empty'){
    drag.moved=true; const r=view.getBoundingClientRect(), b=$('band');
    drag.rect=[Math.min(drag.start.x,ev.clientX),Math.min(drag.start.y,ev.clientY),Math.max(drag.start.x,ev.clientX),Math.max(drag.start.y,ev.clientY)];
    b.style.left=(drag.rect[0]-r.left)+'px'; b.style.top=(drag.rect[1]-r.top)+'px'; b.style.width=(drag.rect[2]-drag.rect[0])+'px'; b.style.height=(drag.rect[3]-drag.rect[1])+'px'; b.hidden=false;
    return;
  }
  if(!drag.moved){ drag.moved=true; pushUndo(); drag.orig=new Map(selected().map(o=>[o.id,[...o.pos]])); if(drag.mode==='move') magnetStart(drag); }
  setRay(ev);
  if(drag.mode==='size'){
    const d=drag, o=d.o, f=d.f, p=V3();
    if(Math.abs(ray.ray.direction.dot(d.plane.normal))<.04 || !ray.ray.intersectPlane(d.plane,p)) return;
    /* Alt (Option sur Mac) : on agrandit depuis le centre, le centre ne bouge pas et chaque côté suit la poignée */
    const centre=ev.altKey, C=d.f.c, pc=p.clone().sub(C);
    p.sub(d.A); let [w,dp,h]=d.s0; const MIN=.1;
    /* « Garder les proportions » (coché par défaut) : toutes les poignées agrandissent l'objet d'un bloc ; Maj inverse le réglage le temps du geste */
    const lock=$('f-lock').checked!==ev.shiftKey;
    if(d.top){ h=Math.max(MIN,snapv(centre?2*pc.dot(f.az):p.dot(f.az))); if(lock){ const k=h/d.s0[2]; w=d.s0[0]*k; dp=d.s0[1]*k; } }
    else{
      if(d.sx) w=Math.max(MIN,snapv(centre?2*pc.dot(f.ax)*d.sx:p.dot(f.ax)*d.sx));
      if(d.sy) dp=Math.max(MIN,snapv(centre?2*pc.dot(f.ay)*d.sy:p.dot(f.ay)*d.sy));
      if(lock){ const k=d.sx&&d.sy?Math.max(w/d.s0[0],dp/d.s0[1]):d.sx?w/d.s0[0]:dp/d.s0[1]; w=d.s0[0]*k; dp=d.s0[1]*k; h=d.s0[2]*k; }
    }
    /* toutes les cotes suivent le pas de la grille ; les champs « Cotes » permettent d'être plus précis */
    if(S.snap){ w=Math.max(S.snap,snapv(w)); dp=Math.max(S.snap,snapv(dp)); h=Math.max(S.snap,snapv(h)); }
    o.size=[w,dp,h];
    const c=centre?C.clone():d.A.clone().addScaledVector(f.az,h/2);
    if(!centre && !d.top) c.addScaledVector(f.ax,d.sx*w/2).addScaledVector(f.ay,d.sy*dp/2);
    o.pos=[c.x,c.y,c.z];
    if(d.multi){
      /* la boîte virtuelle a changé : chaque objet suit le même étirement, par axe du monde */
      const b0=d.multi.box0, fc=[0,1,2].map(i=>o.size[i]/d.s0[i]), mn=[0,1,2].map(i=>o.pos[i]-o.size[i]/2);
      for(const it of d.multi.items){
        it.q.pos=it.pos.map((v,i)=>mn[i]+(v-b0.min[i])*fc[i]);
        /* l'axe local i de l'objet est étiré selon la direction qu'il occupe dans le monde (exact pour les quarts de tour) */
        it.q.size=it.size.map((v,i)=>{ const a=it.ax[i]; return v*Math.hypot(a.x*fc[0],a.y*fc[1],a.z*fc[2]); });
      }
    }
    showTip(ev, (lock ? fmt(w)+' × '+fmt(dp)+' × '+fmt(h) : d.top ? 'H '+fmt(h) : fmt(w)+' × '+fmt(dp))+' '+S.unit);
    syncMeshes(); updateInspector(); return;
  }
  if(drag.mode==='rot'){
    const d=drag, p=V3(); let ang;
    if(d.flat) ang=(ev.clientX-d.start.x)*.5;
    else{ if(!ray.ray.intersectPlane(d.plane,p)) return; p.sub(d.f.c); ang=Math.atan2(V3().crossVectors(d.v0,p).dot(d.e), d.v0.dot(p))/D2R; }
    rotRing.visible=!d.flat;
    const step=ev.shiftKey?45:(!d.flat&&p.length()<d.R)?15:1; ang=Math.round(ang/step)*step;
    const q=new THREE.Quaternion().setFromAxisAngle(d.e,ang*D2R).multiply(d.f.q), eu=new THREE.Euler().setFromQuaternion(q,'XYZ');
    d.o.rot=[eu.x/D2R,eu.y/D2R,eu.z/D2R].map(r=>Math.round(r*1000)/1000+0);
    showTip(ev, ang+'°');
    syncMeshes(); updateInspector(); return;
  }
  const p=new THREE.Vector3(); if(!ray.ray.intersectPlane(drag.plane,p)) return;
  let dl=[snapv(p.x-drag.p0.x), snapv(p.y-drag.p0.y)]; const dz=snapv(p.z-drag.p0.z);
  if(drag.mode==='move' && S.magnet && !ev.altKey) dl=magnetApply(drag,dl); else guides.visible=false;
  for(const o of selected()){ const a=drag.orig.get(o.id); if(drag.mode==='move'){ o.pos[0]=a[0]+dl[0]; o.pos[1]=a[1]+dl[1]; } else o.pos[2]=a[2]+dz; }
  syncMeshes(); updateInspector();
  if(drag.mode==='lift'){ const o=selected()[0]; if(o) showTip(ev,'Z '+fmt(boxOf(o).min[2])+' '+S.unit); }
});
function showTip(ev,txt){ const t=$('tip'), r=view.getBoundingClientRect(); t.textContent=txt; t.style.left=(ev.clientX-r.left)+'px'; t.style.top=(ev.clientY-r.top)+'px'; t.hidden=false; }
const endDrag=ev=>{
  $('tip').hidden=true; guides.visible=false; rotRing.visible=false; draw();
  if(nd){ const n=nd; nd=null; if(!n.moved && n.ctx) openCtx(ev); return; }
  if(!drag) return;
  if(!drag.moved){
    if(drag.mode==='empty'){ S.sel.clear(); refresh(); }
    else if(drag.mode==='move' && drag.clickId && S.sel.size>1){ S.sel=withGroup([drag.clickId]); refresh(); }
  }else if(drag.mode==='size'){ settle(drag.o); refresh(); }
  else if(drag.mode==='empty'){
    /* cadre : on prend tout objet dont l'encombrement à l'écran touche le rectangle */
    $('band').hidden=true;
    const R=drag.rect, cr=canvas.getBoundingClientRect(), hit=ev.shiftKey?new Set(S.sel):new Set(), q=new THREE.Vector3();
    if(R) for(const o of S.objs){
      const b=boxOf(o); let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
      for(let c=0;c<8;c++){ q.set(c&1?b.max[0]:b.min[0], c&2?b.max[1]:b.min[1], c&4?b.max[2]:b.min[2]).project(camera);
        const x=cr.left+(q.x+1)/2*cr.width, y=cr.top+(1-q.y)/2*cr.height; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
      if(x0<=R[2]&&x1>=R[0]&&y0<=R[3]&&y1>=R[1]) hit.add(o.id);
    }
    S.sel=withGroup(hit); refresh();
  }
  else{ updateInspector(); autosave(); }
  drag=null;
};
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);

const cornerCache=new WeakMap();
function hasCorners(pf){
  let r=cornerCache.get(pf.src); if(r!==undefined) return r; r=false;
  for(const c of pf.src){ const n=c.length;
    for(let i=0;i<n&&!r;i++){ const a=c[(i+n-1)%n], b=c[i], d=c[(i+1)%n], ux=b[0]-a[0], uy=b[1]-a[1], vx=d[0]-b[0], vy=d[1]-b[1], l=Math.hypot(ux,uy)*Math.hypot(vx,vy);
      if(l>1e-12 && (ux*vx+uy*vy)/l<Math.cos(25*D2R)) r=true; }
    if(r) break; }
  cornerCache.set(pf.src,r); return r;
}

   qu'à l'export, ou quand on les fige. ---------- */
const symGroup=new THREE.Group(); scene.add(symGroup);

function symMatrices(){
  const cx=S.plate[0]/2, cy=S.plate[1]/2, T1=new THREE.Matrix4().makeTranslation(cx,cy,0), T0=new THREE.Matrix4().makeTranslation(-cx,-cy,0);
  return (SYMX[S.sym]||[]).map(([m,d])=>{ const g=new THREE.Matrix4().makeRotationZ(d*D2R); if(m) g.multiply(new THREE.Matrix4().makeScale(-1,1,1)); return T1.clone().multiply(g).multiply(T0); });

  while(symGroup.children.length){ const c=symGroup.children.pop(); if(c.isLine) c.geometry.dispose(); }
  if(!S.sym){ return; }
  /* chaque frontière de part est dessinée en trois traits décalés : elle reste lisible à toute distance */
  const [W,D]=S.plate, cx=W/2, cy=D/2, pts=[], L=(x0,y0,x1,y1)=>{ for(const o of [-.35,0,.35]) pts.push(x0+o,y0+o,.15,x1+o,y1+o,.15); };
  L(cx,0,cx,D); if(S.sym>=4) L(0,cy,W,cy);
  if(S.sym===8){ const h=Math.min(W,D)/2; L(cx-h,cy-h,cx+h,cy+h); L(cx-h,cy+h,cx+h,cy-h); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  const ln=new THREE.LineSegments(g,symLineMat); ln.computeLineDistances(); symLineMat.color.set(theme.accent); symGroup.add(ln);
  const Ms=symMatrices();
  for(const m of meshes.values()){ m.updateMatrix();

function repeatCopies(list){

  if(n<2||n>200) return {err:'Le nombre doit être compris entre 2 et 200.'};
  if(type==='lin' && !a && !b && !c) return {err:'Indique un écart sur au moins un axe.'};
  const made=[];
  const batch=fn=>{ const arr=list.map(fn); regid(arr); made.push(...arr); };
  if(type==='lin') for(let i=1;i<n;i++) batch(o=>{ const k=cloneObj(o); k.id=S.nextId++; k.pos[0]+=a*i; k.pos[1]+=b*i; k.pos[2]+=c*i; return k; });
  else{ /* cercle de diamètre a : l'objet d'origine reste en place, le centre est à sa droite */
    const bb=boxOfMany(list), cx=(bb.min[0]+bb.max[0])/2+a/2, cy=(bb.min[1]+bb.max[1])/2;

function spawnTile(parent,icon,labelFr,factory){
  const el=document.createElement('button'); el.className='tile'; el.innerHTML=icon; el.dataset.tt=labelFr; parent.appendChild(el);
  let st=null; const plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
  el.addEventListener('pointerdown',ev=>{ if(ev.button!==0) return; st={x:ev.clientX,y:ev.clientY,o:null,added:false}; el.setPointerCapture(ev.pointerId); });
  el.addEventListener('pointermove',ev=>{
    if(!st) return;
    if(!st.o){ if(Math.hypot(ev.clientX-st.x,ev.clientY-st.y)<6) return; st.o=factory(); if(!st.o){ st=null; return; } }
    if(!overCanvas(ev)) return;
    setRay(ev); const p=new THREE.Vector3(); if(!ray.ray.intersectPlane(plane,p)) return;
    if(!st.added){ pushUndo(); S.objs.push(st.o); S.sel=new Set([st.o.id]); st.added=true; }
    st.o.pos=[snapv(p.x),snapv(p.y),st.o.size[2]/2]; syncMeshes();
  });
  const end=ev=>{
    if(!st) return; const s=st; st=null;
    if(!s.o){ const o=factory(); if(o) placeCentre(o); return; }
    if(s.added && overCanvas(ev)) refresh();
    else if(s.added){ S.objs=S.objs.filter(q=>q!==s.o); S.undo.pop(); S.sel.clear(); refresh(); }
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('click',ev=>{ if(ev.detail===0){ const o=factory(); if(o) placeCentre(o); } });
}

[['front','translateZ(25px)',[0,-1,0]],['back','rotateY(180deg) translateZ(25px)',[0,1,0]],['right','rotateY(90deg) translateZ(25px)',[1,0,0]],['left','rotateY(-90deg) translateZ(25px)',[-1,0,0]],

  camera.updateMatrixWorld(); const e=camera.matrixWorldInverse.copy(camera.matrixWorld).invert().elements;
  /* repère du cube : x = X du monde, y (vers le bas) = −Z, z (vers soi) = −Y */
  const c0=[e[0],-e[1],e[2]], c1=[-e[8],e[9],-e[10]], c2=[-e[4],e[5],-e[6]];
  cube.style.transform='matrix3d('+[...c0,0,...c1,0,...c2,0,0,0,0,1].map(v=>+v.toFixed(5)).join(',')+')';
}
{ let cd=null; const w=$('cubewrap');

addEventListener('keydown',ev=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)){ if(ev.key==='Enter') ev.target.blur(); return; }
  const mod=ev.ctrlKey||ev.metaKey, k=ev.key.toLowerCase(); let done=true;
  if(mod&&k==='s') saveProject(ev.shiftKey);
  else if(DESK&&mod&&k==='o') openDialog();
  else if(DESK&&mod&&k==='n') newProject();
  else if(mod&&k==='z') ev.shiftKey?redo():undo();
  else if(mod&&k==='y') redo();
  else if(mod&&ev.shiftKey&&k==='f') fuseSel();
  else if(mod&&k==='g') ev.shiftKey?ungroupSel():groupSel();
  else if(mod&&k==='d') duplicateSel();
  else if(mod&&k==='c') copySel();
  else if(mod&&k==='v') pasteSel();
  else if(mod&&k==='a'){ S.sel=new Set(S.objs.map(o=>o.id)); refresh(); }
  else if(k==='delete'||k==='backspace') removeSel();
  else if(k==='escape'){ if(openPop||!$('ctx').hidden){ closePops(); hideCtx(); } else { S.sel.clear(); refresh(); } }
  else if(k==='d') dropSel();
  else if(k==='f') fitView();
  else if(k==='h'&&S.sel.size) editSel(o=>{o.hole=true});
  else if(k==='s'&&!mod&&S.sel.size) editSel(o=>{o.hole=false});
  else if(k.startsWith('arrow')&&S.sel.size){ const st=(S.snap||1)*(ev.shiftKey?10:1), d={arrowleft:[-st,0],arrowright:[st,0],arrowup:[0,st],arrowdown:[0,-st]}[k];
    pushUndo(); selected().forEach(o=>{o.pos[0]+=d[0];o.pos[1]+=d[1]}); refresh(); }
  else done=false;
  if(done) ev.preventDefault();
});

/* les boîtes et cylindres d'anciennes scènes deviennent des profils, pour accepter les arrondis */
function upgradeOld(){
  for(const o of S.objs){
    if(o.kind!=='shape'||o.prof||!o.name) continue;
    if(!o.shp&&!o.smooth){
      const k2={'Cône':'cone','Pyramide':'pyramid','Rampe':'wedge','Dôme':'dome'}[(o.name.match(/^(Cône|Pyramide|Rampe|Dôme)/)||[])[1]];
      if(k2&&o.base.tris.length===SHAPES[k2].oldTris){ o.shp={...SHAPES[k2].shp}; continue; }
      if(/^(Sphère|Anneau)/.test(o.name)){ o.smooth=1; continue; }
    }
    const k=/^Boîte/.test(o.name)?'box':/^Cylindre/.test(o.name)?'cyl':null; if(!k||o.base.tris.length!==SHAPES[k].oldTris) continue;
    const size=[...o.size]; o.kind='profile'; o.prof=SHAPES[k].prof; o.base=SHAPES[k].base; o.size=size; settle(o);
  }
}
