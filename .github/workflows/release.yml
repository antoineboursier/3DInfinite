name: Publier une version officielle

# Publication décidée à la main : onglet Actions → « Publier une version officielle » → Run workflow.
# Rien ne se publie tout seul quand on pousse du code.
# Le workflow lit la version dans package.json et les notes dans CHANGELOG.md, fabrique l'installeur Windows (.exe)
# et les deux .dmg macOS, puis crée la release d'un seul coup (les utilisateurs ne sont prévenus qu'une fois tout prêt).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::La version v$V est déjà publiée. Augmente \"version\" dans package.json et ajoute ses notes dans CHANGELOG.md."; exit 1
          fi
          node tools/release-notes.mjs "$V" > /dev/null
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installeurs-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Créer la release avec ses notes et ses installeurs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.check.outputs.version }}
        run: |
          node tools/release-notes.mjs "$V" > notes.md
          ls -la out
          gh release create "v$V" out/* --target "$GITHUB_SHA" --title "3DInfinite $V" --notes-file notes.md --latest
