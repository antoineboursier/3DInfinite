name: Publier les installeurs

# Publier une nouvelle version = changer "version" dans package.json puis pousser sur main.
# Si la release de cette version n'existe pas encore, elle est créée (avec son tag) et les installeurs
# Windows (.exe) et macOS (.dmg) y sont ajoutés. Bouton « Run workflow » possible pour un premier essai.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      create: ${{ steps.v.outputs.create }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La version v$V existe déjà : rien à publier."
            echo "create=no" >> "$GITHUB_OUTPUT"
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "3DInfinite $V" --generate-notes
            echo "create=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.create == 'yes'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: Fabriquer et publier
        run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
